config_version: 1

run:
  name: cancer-notes-end-to-end
  output_dir: example-runs

input:
  path: examples/data/cancer_notes.jsonl
  format: jsonl
  record_id_column: note_id
  entity_id:
    source: column
    column: patient_id
  text_column: note_text
  metadata_columns:
    - patient_name
    - date_of_birth
    - medical_record_number
    - service_date
    - facility
    - note_type
  structured_phi_columns:
    patient_name: NAME
    date_of_birth: DATE
    medical_record_number: ID
    service_date: DATE
    facility: LOCATION

policy:
  policy_version: 1
  categories:
    NAME:
      action: surrogate
      surrogate:
        method: faker
        consistency: entity
        secret_reference: literal:health-deid-cancer-example-name
    DATE:
      action: surrogate
      surrogate:
        method: date_shift
        consistency: entity
        minimum_weeks: -52
        maximum_weeks: 52
        fallback: year_only
        secret_reference: literal:health-deid-cancer-example-date
    AGE:
      action: generalize
      generalization: age_90_plus
    ID:
      action: surrogate
      surrogate:
        method: faker
        consistency: record
        secret_reference: literal:health-deid-cancer-example-id
    LOCATION:
      action: surrogate
      surrogate:
        method: faker
        consistency: entity
        secret_reference: literal:health-deid-cancer-example-location
    PHONE_OR_FAX:
      action: surrogate
      surrogate:
        method: faker
        consistency: occurrence
        secret_reference: literal:health-deid-cancer-example-phone
    EMAIL:
      action: surrogate
      surrogate:
        method: faker
        consistency: entity
        secret_reference: literal:health-deid-cancer-example-email
    URL:
      action: redact
    IP_ADDRESS:
      action: redact
    BIOMETRIC:
      action: redact
    PHOTO:
      action: redact
    OTHER_ID:
      action: surrogate
      surrogate:
        method: faker
        consistency: record
        secret_reference: literal:health-deid-cancer-example-other-id
    PROFESSION:
      action: retain
    UNMAPPED:
      action: redact

detection:
  enabled: true
  detectors:
    - backend: aws_comprehend_medical
      region_name: us-east-1
      min_confidence: 0.0
      cost_per_100_characters_usd: 0.0014
    - backend: aws_bedrock
      region_name: us-east-1
      min_confidence: 0.0
      reasoning_effort: none
      input_cost_per_million_tokens: 3.0
      output_cost_per_million_tokens: 15.0
  execution:
    workers: 4

rules:
  enabled: true
  rules_path: examples/rules/custom_rules.yaml

validation:
  enabled: true
  backend: aws_bedrock_safeguard
  region_name: us-east-1
  input_cost_per_million_tokens: 0.15
  output_cost_per_million_tokens: 0.60
  execution:
    workers: 4

review:
  enabled: true
  review_scope: all
