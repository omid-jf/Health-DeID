config_version: 1

run:
  name: revised-detector-reuse
  output_dir: example-runs

input:
  path: examples/data/sample_notes.jsonl
  format: jsonl
  record_id_column: note_id
  entity_id:
    source: column
    column: patient_id
  text_column: note_text
  metadata_columns:
    - service_date
    - note_type
  structured_phi_columns:
    service_date: DATE

policy:
  policy_version: 1
  categories:
    NAME:
      action: redact
    DATE:
      action: redact
    AGE:
      action: generalize
      generalization: age_90_plus
    ID:
      action: redact
    LOCATION:
      action: redact
    PHONE_OR_FAX:
      action: redact
    EMAIL:
      action: redact
    URL:
      action: redact
    IP_ADDRESS:
      action: redact
    BIOMETRIC:
      action: redact
    PHOTO:
      action: redact
    OTHER_ID:
      action: redact
    PROFESSION:
      action: retain
    UNMAPPED:
      action: redact

detection:
  enabled: true
  detectors:
    - backend: aws_comprehend_medical
      region_name: us-east-1
      min_confidence: 0.0
      cost_per_100_characters_usd: 0.0014
    - backend: aws_bedrock
      region_name: us-east-1
      min_confidence: 0.0
      reasoning_effort: none
      input_cost_per_million_tokens: 3.0
      output_cost_per_million_tokens: 15.0
  execution:
    workers: 2

rules:
  enabled: true
  rules_path: examples/rules/custom_rules.yaml

validation:
  enabled: false

review:
  enabled: false
