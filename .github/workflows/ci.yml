name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"

      - name: Install quality dependencies
        run: uv sync --locked --no-dev --group lint --group test

      - name: Check Python
        run: |
          uv run ruff check src tests docs examples/scripts
          uv run ruff format --check src tests docs examples/scripts
          uv run mypy src

      - name: Check templates
        run: uv run djlint src/health_deid/ui/templates --lint

      - name: Check browser JavaScript
        run: find src/health_deid/ui/static -name '*.js' -exec node --check {} +

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --locked --no-dev --group test

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && !env.ACT
        uses: codecov/codecov-action@v7.0.0
        with:
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          flags: python-3.13
          fail_ci_if_error: false

  package:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          python-version: "3.13"

      - name: Check lock file
        run: uv lock --check

      - name: Build and validate distributions
        run: |
          uv build
          uvx twine check dist/*
